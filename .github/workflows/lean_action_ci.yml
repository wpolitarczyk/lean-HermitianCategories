name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lean library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

  documentation:
    name: Build and deploy documentation
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
      # Each job has its own runner. Restore the build cache and prepare Lean
      # before docgen builds the documentation and deploys it to Pages.
      - name: Prepare Lean and dependencies
        uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
      - name: Check disk space and add swap
        run: bash .github/scripts/prepare-docs-runner.sh
      - name: Start resource monitoring
        shell: bash
        run: |
          diagnostics_dir="$RUNNER_TEMP/docs-runner-diagnostics"
          mkdir -p "$diagnostics_dir"
          nohup bash .github/scripts/monitor-docs-runner.sh > "$diagnostics_dir/resource-usage.log" 2>&1 < /dev/null &
          echo "$!" > "$diagnostics_dir/monitor.pid"
      - uses: leanprover-community/docgen-action@v1
      - name: Report runner resources
        if: always()
        shell: bash
        run: |
          diagnostics_dir="$RUNNER_TEMP/docs-runner-diagnostics"
          mkdir -p "$diagnostics_dir"
          if [[ -f "$diagnostics_dir/monitor.pid" ]]; then
            kill "$(cat "$diagnostics_dir/monitor.pid")" 2>/dev/null || true
          fi
          bash .github/scripts/monitor-docs-runner.sh --once >> "$diagnostics_dir/resource-usage.log" 2>&1
          cat "$diagnostics_dir/resource-usage.log"
      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-runner-diagnostics
          path: ${{ runner.temp }}/docs-runner-diagnostics/resource-usage.log
          if-no-files-found: warn
          retention-days: 7

  documentation-diagnostics:
    name: Diagnose documentation build (no deployment)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOCS_DIAGNOSTICS_DETAILED: 'true'
      DOCS_MONITOR_INTERVAL_SECONDS: '5'

    steps:
      - uses: actions/checkout@v5
      - name: Prepare Lean and dependencies
        uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
      - name: Check disk space and add swap
        run: bash .github/scripts/prepare-docs-runner.sh
      - name: Prepare syscall tracing and capture system limits
        shell: bash
        run: |
          if ! command -v strace > /dev/null || ! command -v python3 > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends strace python3
          fi
          bash .github/scripts/collect-docs-diagnostics.sh before
      - name: Enable memory overcommit for the diagnostic build
        run: bash .github/scripts/docs-overcommit.sh enable
      - name: Start resource monitoring
        shell: bash
        run: |
          diagnostics_dir="$RUNNER_TEMP/docs-runner-diagnostics"
          mkdir -p "$diagnostics_dir"
          nohup bash .github/scripts/monitor-docs-runner.sh > "$diagnostics_dir/resource-usage.log" 2>&1 < /dev/null &
          echo "$!" > "$diagnostics_dir/monitor.pid"
      # docgen-action itself skips its API build on workflow_dispatch, so run
      # the equivalent Lake build directly, without its deployment steps.
      - name: Build API documentation with a cold docs cache
        run: bash .github/scripts/build-docs-diagnostics.sh
      - name: Capture final system limits and kernel messages
        if: always()
        run: bash .github/scripts/collect-docs-diagnostics.sh after
      - name: Restore original memory overcommit policy
        if: always()
        run: bash .github/scripts/docs-overcommit.sh restore
      - name: Report runner resources
        if: always()
        shell: bash
        run: |
          diagnostics_dir="$RUNNER_TEMP/docs-runner-diagnostics"
          mkdir -p "$diagnostics_dir"
          if [[ -f "$diagnostics_dir/monitor.pid" ]]; then
            kill "$(cat "$diagnostics_dir/monitor.pid")" 2>/dev/null || true
          fi
          bash .github/scripts/monitor-docs-runner.sh --once >> "$diagnostics_dir/resource-usage.log" 2>&1
          cat "$diagnostics_dir/resource-usage.log"
      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-runner-diagnostics
          path: |
            ${{ runner.temp }}/docs-runner-diagnostics/*.log
            ${{ runner.temp }}/docs-runner-diagnostics/*.txt
          if-no-files-found: warn
          retention-days: 7
